name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-ci.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+-ci.[0-9]+'
  # CI pipeline for tagged releases: Fast unit tests + Docker build + SDK tests
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci-build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
      test_results: ${{ steps.tests.outputs.test_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Maven Build
        id: build
        uses: ./.github/actions/maven-build
        with:
          skip_tests: 'true'
          timeout_minutes: '25'

      - name: Run Tests
        id: tests
        if: ${{ !inputs.skip_tests }}
        uses: ./.github/actions/run-tests
        with:
          maven_profiles: 'tests-integration,tests-e2e'
          excluded_groups: 'Slow,SlowTest,Flaky,Manual,ManualOnly'
          timeout_minutes: '25'
          report_name: 'ci-test-reports'

  ci-summary:
    runs-on: ubuntu-latest
    needs: ci-build
    if: always()
    permissions: {}

    steps:
      - name: CI Summary
        run: |
          BUILD_RESULT="${{ needs.ci-build.result }}"
          TEST_OUTPUT="${{ needs.ci-build.outputs.test_results }}"

          # When ci-build fails, GitHub Actions drops job outputs — but we can
          # infer the test result from the job result and whether the step ran.
          if [ "$BUILD_RESULT" == "failure" ]; then
            if [ -n "$TEST_OUTPUT" ]; then
              TEST_DISPLAY="$TEST_OUTPUT"
            else
              # Job failed — test status can't be read from outputs.
              # If tests ran, reconcile-status would have set this; if empty,
              # either the build failed before tests, or the test step itself failed.
              TEST_DISPLAY="failed (job failed, see logs)"
            fi
          elif [ "$BUILD_RESULT" == "success" ]; then
            # Empty output when job succeeded → tests were skipped
            TEST_DISPLAY="${TEST_OUTPUT:-skipped}"
          else
            TEST_DISPLAY="${TEST_OUTPUT:-unknown}"
          fi

          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $BUILD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Results | $TEST_DISPLAY |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ needs.ci-build.outputs.image_tag || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
