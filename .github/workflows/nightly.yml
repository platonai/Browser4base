name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allow manual workflow runs
  workflow_dispatch:

# Prevent concurrent nightly builds
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx3g -XX:+UseG1GC'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      test_results: ${{ steps.tests.outputs.test_status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Maven Build
        id: build
        uses: ./.github/actions/maven-build
        with:
          skip_tests: 'true'
          timeout_minutes: '25'

      # The local page store survives between runs on the same runner. Clean it
      # so every URL is fetched for real in this run (pages otherwise never
      # expire with the default fetch schedule and stale content would be reused).
      - name: Clean Page Store
        run: rm -rf ~/.pulsar/data/store

      - name: Run All Unit Tests
        id: tests
        uses: ./.github/actions/run-tests
        with:
          maven_profiles: 'tests-integration,tests-e2e'
          excluded_groups: 'Manual,ManualOnly'
          timeout_minutes: '45'
          report_name: 'nightly-test-reports'

  nightly-summary:
    runs-on: ubuntu-latest
    needs: ci-build
    if: always()
    permissions: {}

    steps:
      - name: Nightly Build Summary
        run: |
          BUILD_RESULT="${{ needs.ci-build.result }}"
          TEST_OUTPUT="${{ needs.ci-build.outputs.test_results }}"

          # When ci-build fails, GitHub Actions drops job outputs — but we can
          # infer the test result from the job result and whether the step ran.
          if [ "$BUILD_RESULT" == "failure" ]; then
            if [ -n "$TEST_OUTPUT" ]; then
              TEST_DISPLAY="$TEST_OUTPUT"
            else
              TEST_DISPLAY="failed (job failed, see logs)"
            fi
          elif [ "$BUILD_RESULT" == "success" ]; then
            # Empty output when job succeeded → tests were skipped
            TEST_DISPLAY="${TEST_OUTPUT:-skipped}"
          else
            TEST_DISPLAY="${TEST_OUTPUT:-unknown}"
          fi

          echo "## Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $BUILD_RESULT |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Results | $TEST_DISPLAY |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

  coverage-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          java_version: ${{ env.JAVA_VERSION }}

      # Clean the local page store so every URL is fetched for real in this run
      # (pages never expire with the default fetch schedule).
      - name: Clean Page Store
        run: rm -rf ~/.pulsar/data/store

      - name: Maven Build with Tests and Aggregate Coverage
        id: build
        uses: ./.github/actions/maven-build
        with:
          skip_tests: 'false'
          maven_profiles: 'coverage-report'
          maven_args: '-DrunITs=true -DrunE2Es=true -DrunJsTests=true -Dmaven.test.redirectTestOutputToFile=true'
          timeout_minutes: '90'

      - name: Upload Aggregate Coverage Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-aggregate-report
          path: pulsar-coverage-report/target/site/jacoco-aggregate
          if-no-files-found: warn
