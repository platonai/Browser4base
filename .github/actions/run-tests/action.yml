name: Run Tests
description: Execute Maven tests with configurable options and reporting
author: platonai
branding:
  icon: 'check-square'
  color: 'purple'

inputs:
  maven_profiles:
    description: 'Maven profiles to activate'
    required: false
    default: ''
  test_excludes:
    description: 'Test patterns to exclude (Surefire format)'
    required: false
    default: '**manual**'
  test_includes:
    description: 'Test patterns to include (Surefire format)'
    required: false
    default: ''
  excluded_groups:
    description: 'JUnit groups/tags to exclude (comma-separated)'
    required: false
    default: ''
  timeout_minutes:
    description: 'Test timeout in minutes (default: 35)'
    required: false
    default: '35'
  fail_fast:
    description: 'Fail fast on first test failure (default: false)'
    required: false
    default: 'false'
  parallel_tests:
    description: 'Enable parallel test execution (default: false)'
    required: false
    default: 'false'
  test_reports:
    description: 'Generate test reports (default: true)'
    required: false
    default: 'true'
  run_pulsar_tests:
    description: 'Run pulsar-tests module tests (default: true for CI)'
    required: false
    default: 'true'
  report_name:
    description: 'Name suffix for test reports artifact (default: test-reports)'
    required: false
    default: 'test-reports'

outputs:
  test_status:
    description: 'Test execution status'
    value: ${{ steps.reconcile-status.outputs.status }}
  test_count:
    description: 'Total number of tests executed'
    value: ${{ steps.test-summary.outputs.test_count }}
  failed_count:
    description: 'Number of failed tests'
    value: ${{ steps.test-summary.outputs.failed_count }}
  passed_count:
    description: 'Number of passed tests'
    value: ${{ steps.test-summary.outputs.passed_count }}
  skipped_count:
    description: 'Number of skipped tests'
    value: ${{ steps.test-summary.outputs.skipped_count }}

runs:
  using: "composite"
  steps:
    - name: Pre-test Setup
      shell: bash
      run: |
        echo "::group::Test Setup"

        # Ensure Maven wrapper is available
        if [ ! -f "./mvnw" ] && ! command -v mvn &> /dev/null; then
          echo "❌ Neither Maven wrapper nor system Maven found"
          exit 1
        fi

        MAVEN_CMD=$([ -f "./mvnw" ] && echo "./mvnw" || echo "mvn")
        echo "MAVEN_CMD=$MAVEN_CMD" >> $GITHUB_ENV

        # Create test results directory
        mkdir -p test-results

        echo "✅ Test environment prepared"
        echo "::endgroup::"

    - name: Run Tests
      id: run-tests
      shell: bash
      run: |
        echo "::group::Running Tests"

        start_time=$(date +%s)

        echo "🧪 Starting test execution..."
        echo "📋 Test Configuration:"
        echo "  - Profiles: ${{ inputs.maven_profiles }}"
        echo "  - Excludes: ${{ inputs.test_excludes }}"
        echo "  - Includes: ${{ inputs.test_includes }}"
        echo "  - Excluded Groups: ${{ inputs.excluded_groups }}"
        echo "  - Timeout: ${{ inputs.timeout_minutes }} minutes"
        echo "  - Fail Fast: ${{ inputs.fail_fast }}"
        echo "  - Parallel: ${{ inputs.parallel_tests }}"
        echo "  - Reports: ${{ inputs.test_reports }}"
        echo "  - Run Pulsar Tests: ${{ inputs.run_pulsar_tests }}"

        # Build test command
        test_cmd="$MAVEN_CMD test"

        # Add profiles
        if [ -n "${{ inputs.maven_profiles }}" ]; then
          test_cmd="$test_cmd -P${{ inputs.maven_profiles }}"
        fi

        # Add test excludes
        if [ -n "${{ inputs.test_excludes }}" ]; then
          test_cmd="$test_cmd -Dsurefire.excludes=${{ inputs.test_excludes }}"
        fi

        # Add test includes
        if [ -n "${{ inputs.test_includes }}" ]; then
          test_cmd="$test_cmd -Dsurefire.includes=${{ inputs.test_includes }}"
        fi

        # Add excluded groups/tags
        if [ -n "${{ inputs.excluded_groups }}" ]; then
          test_cmd="$test_cmd -Dsurefire.excludedGroups=${{ inputs.excluded_groups }}"
        fi

        # Add fail fast
        if [ "${{ inputs.fail_fast }}" == "true" ]; then
          test_cmd="$test_cmd -Dsurefire.skipAfterFailureCount=1"
        fi

        # Add parallel execution
        if [ "${{ inputs.parallel_tests }}" == "true" ]; then
          test_cmd="$test_cmd -Dsurefire.parallel=methods -Dsurefire.threadCount=4"
        fi

        # Add browser4-tests flag
        if [ "${{ inputs.run_pulsar_tests }}" == "true" ]; then
          test_cmd="$test_cmd -DrunITs=true"
        fi

        # Add batch mode and other options
        test_cmd="$test_cmd -B"

        echo "🚀 Executing: $test_cmd"
        echo ""

        # Log file for Maven output — used by downstream steps for diagnostics
        MAVEN_LOG="maven-test-output.log"
        echo "📝 Maven output will be captured to: $MAVEN_LOG"

        # Execute tests with timeout, tee-ing output to both stdout and a log file.
        # NOTE: GitHub Actions runs bash with `set -e`, so a pipeline's exit code
        # is the LAST command's (tee, which always succeeds). Use PIPESTATUS to
        # capture the actual timeout/Maven exit code.
        timeout_seconds=$(( ${{ inputs.timeout_minutes }} * 60 ))

        set +o pipefail
        timeout $timeout_seconds $test_cmd 2>&1 | tee "$MAVEN_LOG"
        exit_code=${PIPESTATUS[0]}
        set -o pipefail

        end_time=$(date +%s)
        test_time=$((end_time - start_time))

        # Distinguish timeout (124) from other failures
        if [ $exit_code -eq 0 ]; then
          echo ""
          echo "✅ Tests completed successfully in ${test_time} seconds"
          echo "status=success" >> $GITHUB_OUTPUT
        elif [ $exit_code -eq 124 ]; then
          echo ""
          echo "⏰ Tests timed out after ${test_time} seconds (limit: ${{ inputs.timeout_minutes }} minutes)"
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "failure_reason=timeout" >> $GITHUB_OUTPUT
        else
          echo ""
          echo "❌ Tests failed after ${test_time} seconds (exit code: $exit_code)"
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
        fi

        echo "::endgroup::"

    - name: Test Summary
      id: test-summary
      if: always()
      shell: bash
      run: |
        echo "::group::Test Summary"

        total_tests=0
        failed_tests=0
        passed_tests=0
        skipped_tests=0

        # Parse Surefire reports - using a more reliable way to check for test files
        TEST_FILES_EXIST=0
        find . -name "TEST-*.xml" -type f -print -quit | grep -q . && TEST_FILES_EXIST=1

        if [ $TEST_FILES_EXIST -eq 1 ]; then
          echo "📊 Parsing test reports..."

          # Count tests from XML reports - using a safer approach
          while IFS= read -r xml_file; do
            if [ -f "$xml_file" ]; then
              tests=$(grep -o 'tests="[0-9]*"' "$xml_file" | cut -d'"' -f2 || echo "0")
              failures=$(grep -o 'failures="[0-9]*"' "$xml_file" | cut -d'"' -f2 || echo "0")
              errors=$(grep -o 'errors="[0-9]*"' "$xml_file" | cut -d'"' -f2 || echo "0")
              skipped=$(grep -o 'skipped="[0-9]*"' "$xml_file" | cut -d'"' -f2 || echo "0")

              total_tests=$((total_tests + tests))
              failed_tests=$((failed_tests + failures + errors))
              skipped_tests=$((skipped_tests + skipped))
            fi
          done < <(find . -name "TEST-*.xml" -type f)

          passed_tests=$((total_tests - failed_tests - skipped_tests))

          echo "📈 Test Results:"
          echo "  - Total Tests: $total_tests"
          echo "  - Passed: $passed_tests"
          echo "  - Failed: $failed_tests"
          echo "  - Skipped: $skipped_tests"

          # Show failed tests
          if [ $failed_tests -gt 0 ]; then
            echo ""
            echo "❌ Failed Tests:"

            # Store files in a temporary file to avoid pipe issues
            tmp_failed_files=$(mktemp)

            # Find files with failures or errors (match any digit count)
            find . -name "TEST-*.xml" -type f | xargs grep -lE 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' 2>/dev/null > "$tmp_failed_files" || true

            # Process each file
            if [ -s "$tmp_failed_files" ]; then
              sort "$tmp_failed_files" | uniq | while read -r xml_file; do
                test_class=$(basename "$xml_file" .xml | sed 's/TEST-//')
                echo "  - $test_class"
              done
            fi

            # Clean up
            rm -f "$tmp_failed_files"
          fi

        else
          echo "⚠️ No Surefire test reports found"

          # Try to get summary from Maven output log
          if [ -f maven-test-output.log ]; then
            echo "📊 Parsing Maven output log..."
            # Maven Surefire prints a summary line like:
            # [INFO] Tests run: 42, Failures: 0, Errors: 0, Skipped: 1
            total_tests=$(grep -oP 'Tests run:\s*\K\d+' maven-test-output.log | tail -1 || echo "0")
            failed_tests=$(grep -oP 'Failures:\s*\K\d+' maven-test-output.log | tail -1 || echo "0")
            errors=$(grep -oP 'Errors:\s*\K\d+' maven-test-output.log | tail -1 || echo "0")
            failed_tests=$((failed_tests + errors))
            echo "  - From Maven output: Tests run: $total_tests, Failures+Errors: $failed_tests"
          fi
        fi

        # Set outputs
        echo "test_count=$total_tests" >> $GITHUB_OUTPUT
        echo "failed_count=$failed_tests" >> $GITHUB_OUTPUT
        echo "passed_count=$passed_tests" >> $GITHUB_OUTPUT
        echo "skipped_count=$skipped_tests" >> $GITHUB_OUTPUT

        # Generate test report summary
        if [ "${{ inputs.test_reports }}" == "true" ]; then
          echo ""
          echo "📋 Test Report Locations:"
          find . -name "surefire-reports" -type d | while read report_dir; do
            echo "  - $report_dir"
            ls -la "$report_dir" | head -5 || true
          done
        fi

        echo "::endgroup::"

    - name: Upload Test Reports
      if: always() && inputs.test_reports == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: ${{ inputs.report_name }}-${{ github.run_id }}
        path: |
          **/target/surefire-reports/**
          **/target/site/jacoco/**
          maven-test-output.log
        retention-days: 7
        if-no-files-found: warn

    - name: Reconcile Test Status
      id: reconcile-status
      if: always()
      shell: bash
      run: |
        echo "::group::Reconciling Test Status"

        # Get the initial status from test execution
        EXEC_STATUS="${{ steps.run-tests.outputs.status }}"
        FAILED_COUNT="${{ steps.test-summary.outputs.failed_count }}"
        MAVEN_LOG="maven-test-output.log"

        # Set defaults if empty
        EXEC_STATUS="${EXEC_STATUS:-failed}"
        FAILED_COUNT="${FAILED_COUNT:-0}"

        echo "🔍 Status Analysis:"
        echo "  - Execution Status: $EXEC_STATUS"
        echo "  - Failed Test Count: $FAILED_COUNT"

        # If Maven reported success, trust it.
        # If Maven reported failure but we have Surefire reports showing 0 failures,
        # this is likely a build/environment failure — still report as failed so the
        # pipeline doesn't silently pass. Only override failure→success when we are
        # certain the reports exist and show zero failures.
        TEST_FILES_EXIST=0
        find . -name "TEST-*.xml" -type f -print -quit | grep -q . && TEST_FILES_EXIST=1

        if [ "$EXEC_STATUS" == "failed" ] && [ "$TEST_FILES_EXIST" -eq 1 ] && [ "$FAILED_COUNT" -eq 0 ]; then
          FINAL_STATUS="failed"

          echo ""
          echo "  🔎 Maven exited non-zero but Surefire reports show 0 test failures."
          echo "  Diagnosing root cause from Maven output log..."

          # Scan the log for common failure patterns
          FAILURE_REASON="unknown"
          FAILURE_DETAIL=""

          if [ -f "$MAVEN_LOG" ]; then
            # 1. Check for compilation errors
            if grep -qE 'COMPILATION ERROR|error:\s|cannot find symbol|Unresolved reference' "$MAVEN_LOG" 2>/dev/null; then
              FAILURE_REASON="compilation_error"
              FAILURE_DETAIL="Compilation errors detected in Maven output. Check the maven-test-output.log artifact."
              echo "  ⚠️  Likely cause: COMPILATION ERROR"
              echo "  Last compilation errors found:"
              grep -E 'COMPILATION ERROR|\[ERROR\].*cannot find symbol|\[ERROR\].*Unresolved reference' "$MAVEN_LOG" 2>/dev/null | tail -5 || true
            # 2. Check for timeout (exit code 124 from the timeout command)
            elif grep -qE 'timed out after' "$MAVEN_LOG" 2>/dev/null; then
              FAILURE_REASON="timeout"
              FAILURE_DETAIL="The test run exceeded the time limit. Consider increasing timeout_minutes or splitting tests."
              echo "  ⚠️  Likely cause: TIMEOUT — test run exceeded the time limit"
            # 3. Check for OOM / memory errors
            elif grep -qE 'OutOfMemoryError|java.lang.OutOfMemoryError|Cannot allocate memory|GC overhead limit exceeded' "$MAVEN_LOG" 2>/dev/null; then
              FAILURE_REASON="oom"
              FAILURE_DETAIL="Out of memory error detected. Consider increasing MAVEN_OPTS heap size (-Xmx)."
              echo "  ⚠️  Likely cause: OUT OF MEMORY"
              grep -E 'OutOfMemoryError|Cannot allocate memory|GC overhead limit' "$MAVEN_LOG" 2>/dev/null | tail -5 || true
            # 4. Check for Maven plugin execution failures
            elif grep -qE 'Failed to execute goal|BUILD FAILURE' "$MAVEN_LOG" 2>/dev/null; then
              FAILURE_REASON="plugin_failure"
              echo "  ⚠️  Likely cause: BUILD/PLUGIN FAILURE"
              echo "  Last plugin execution errors:"
              grep -E 'Failed to execute goal|\[ERROR\].*Failed to execute' "$MAVEN_LOG" 2>/dev/null | tail -5 || true
              FAILURE_DETAIL="A Maven plugin or build step failed. See the error lines above."
            # 5. Check for dependency resolution failures
            elif grep -qE 'Could not resolve dependencies|Could not find artifact|Failed to collect dependencies' "$MAVEN_LOG" 2>/dev/null; then
              FAILURE_REASON="dependency_resolution"
              echo "  ⚠️  Likely cause: DEPENDENCY RESOLUTION FAILURE"
              grep -E 'Could not resolve|Could not find artifact|Failed to collect' "$MAVEN_LOG" 2>/dev/null | tail -5 || true
              FAILURE_DETAIL="Maven could not resolve one or more dependencies."
            # 6. Check for general build errors
            elif grep -qE '\[ERROR\]' "$MAVEN_LOG" 2>/dev/null; then
              FAILURE_REASON="build_error"
              echo "  ⚠️  Likely cause: BUILD ERROR (general)"
              echo "  Last ERROR lines from Maven output:"
              grep '\[ERROR\]' "$MAVEN_LOG" 2>/dev/null | tail -10 || true
              FAILURE_DETAIL="General Maven build errors detected. See the error lines above."
            else
              echo "  ⚠️  No specific error pattern found in Maven log."
              echo "  Last 20 lines of Maven output:"
              tail -20 "$MAVEN_LOG" 2>/dev/null || true
              FAILURE_DETAIL="No specific error pattern matched. Review the full maven-test-output.log artifact."
            fi
          else
            echo "  ⚠️  Maven output log not found — cannot diagnose further."
            FAILURE_DETAIL="Log file was not captured. Check if the tee command succeeded."
          fi

          echo ""
          echo "  - Final Status: failed (Maven exited non-zero, 0 test failures — $FAILURE_REASON)"
          echo "  - Detail: $FAILURE_DETAIL"
          echo "  - 📋 Full Maven log available in the '${{ inputs.report_name }}-${{ github.run_id }}' artifact"
        elif [ "$EXEC_STATUS" == "failed" ] && [ "$TEST_FILES_EXIST" -eq 0 ]; then
          FINAL_STATUS="failed"
          echo "  - Final Status: failed (Maven exited non-zero, no Surefire reports found)"

          if [ -f "$MAVEN_LOG" ]; then
            echo "  Last 20 lines of Maven output:"
            tail -20 "$MAVEN_LOG" 2>/dev/null || true
          fi
        else
          FINAL_STATUS="$EXEC_STATUS"
          echo "  - Final Status: $EXEC_STATUS"
        fi

        # Update the status output
        echo "status=$FINAL_STATUS" >> $GITHUB_OUTPUT

        # Fail the step if the final status is "failed" — this is the ONLY place
        # where we signal failure back to the workflow. Test reports are already
        # uploaded by the previous step (which runs with if: always()).
        if [ "$FINAL_STATUS" == "failed" ]; then
          echo "❌ Tests FAILED — failing this step to signal the pipeline"
          exit 1
        fi

        echo "::endgroup::"
