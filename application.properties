## 1. browser settings

# GUI, HEADLESS
# browser.display.mode=GUI

## LLM settings
# ==================== DOCUMENTATION ====================
# Full LLM configuration guide: docs/config/llm/llm-config.md
# Advanced configuration: docs/config/llm/llm-config-advanced.md
#
# The system auto-detects the provider by scanning for known API keys.
# First match wins. Supported providers are listed below with example configs.
# =======================================================

# ---- Global / Gateway Providers ----

# --- OpenRouter (universal gateway to 300+ models) ---
# openrouter.api.key=sk-or-v1-your-key
# openrouter.model.name=bytedance-seed/seed-1.6
# openrouter.base.url=https://openrouter.ai/api/v1/

# --- Official OpenAI ---
# openai.api.key=sk-your-key
# openai.model.name=gpt-5.6-sol
# openai.base.url=https://api.openai.com/v1

# --- Anthropic Claude (native protocol, not OpenAI-compatible) ---
# anthropic.api.key=sk-ant-your-key
# anthropic.model.name=claude-sonnet-4-6

# --- Google Gemini (native protocol, not OpenAI-compatible) ---
# google.generative.ai.api.key=your-key        # primary key name
# gemini.api.key=your-key                      # alias
# google.api.key=your-key                      # alias
# gemini.model.name=gemini-3.1-flash-lite

# --- xAI / Grok ---
# xai.api.key=your-key
# xai.model.name=grok-4.5
# xai.base.url=https://api.x.ai/v1

# --- Groq ---
# groq.api.key=your-key
# groq.model.name=llama-3.3-70b-versatile
# groq.base.url=https://api.groq.com/openai/v1

# --- Together AI ---
# together.api.key=your-key
# together.model.name=meta-llama/Llama-3.3-70B-Instruct-Turbo
# together.base.url=https://api.together.xyz/v1

# --- Mistral ---
# mistral.api.key=your-key
# mistral.model.name=mistral-large-latest
# mistral.base.url=https://api.mistral.ai/v1

# --- Perplexity ---
# perplexity.api.key=your-key
# perplexity.model.name=llama-3.1-sonar-large-128k-online

# --- Fireworks AI ---
# fireworks.api.key=your-key
# fireworks.model.name=accounts/fireworks/models/llama-v3p3-70b-instruct

# ---- Chinese Domestic Providers ----

# --- DeepSeek ---
# deepseek.api.key=sk-your-key
# deepseek.model.name=deepseek-v4-flash
# deepseek.base.url=https://api.deepseek.com/v1

# --- Alibaba DashScope / Qwen ---
# dashscope.api.key=sk-your-key
# dashscope.model.name=qwen3.6-plus
# dashscope.base.url=https://dashscope.aliyuncs.com/compatible-mode/v1

# --- ByteDance Volcengine / Doubao ---
# volcengine.api.key=your-key
# volcengine.model.name=doubao-seed-2-0-pro-260215
# volcengine.base.url=https://ark.cn-beijing.volces.com/api/v3

# --- Zhipu AI / GLM (智谱AI) ---
# zhipu.api.key=your-key
# zhipu.model.name=glm-5.1
# zhipu.base.url=https://open.bigmodel.cn/api/paas/v4/

# --- Moonshot / Kimi (月之暗面) ---
# moonshot.api.key=your-key
# kimi.api.key=your-key             # alias for moonshot
# moonshot.model.name=kimi-k2.6
# moonshot.base.url=https://api.moonshot.cn/v1

# --- Baichuan (百川智能) ---
# baichuan.api.key=your-key
# baichuan.model.name=Baichuan4
# baichuan.base.url=https://api.baichuan-ai.com/v1

# --- 01.AI / Yi (零一万物) ---
# yi.api.key=your-key
# lingyi.api.key=your-key           # alias for yi
# yi.model.name=yi-large
# yi.base.url=https://api.lingyiwanwu.com/v1

# --- MiniMax / Hailuo (稀宇科技) ---
# Uses Anthropic Messages protocol (not OpenAI-compatible)
# minimax.api.key=your-key
# minimax.model.name=MiniMax-M3

# --- StepFun (阶跃星辰) ---
# stepfun.api.key=your-key
# stepfun.model.name=step-3.5-flash
# stepfun.base.url=https://api.stepfun.com/v1

# --- Tencent Hunyuan (腾讯混元) ---
# hunyuan.api.key=your-key
# tencent.api.key=your-key           # alias for hunyuan
# hunyuan.model.name=hunyuan-pro
# hunyuan.base.url=https://api.lkeap.cloud.tencent.com/v1

# --- Baidu Qianfan / Ernie (百度千帆/文心) ---
# qianfan.api.key=your-key
# baidu.api.key=your-key             # alias for qianfan
# qianfan.model.name=ernie-4.0-8k
# qianfan.base.url=https://qianfan.baidubce.com/v2

